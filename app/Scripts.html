<script>
(function(){
  'use strict';
  const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
  const state={token:localStorage.getItem('class_manager_token')||'',boot:null,page:'dashboard',loading:0,attendance:null,cache:{},viewMode:localStorage.getItem('class_manager_view')||'auto',themeMode:localStorage.getItem('class_manager_theme')||'auto'};
  const NAV=[
    {id:'dashboard',label:'Dashboard',icon:'bi-speedometer2',roles:['管理員','導師','任課教師','行政']},
    {id:'attendance',label:'今日點名',icon:'bi-calendar-check',roles:['管理員','導師','行政']},
    {id:'students',label:'學生管理',icon:'bi-people',roles:['管理員','導師','任課教師','行政']},
    {id:'scores',label:'加減分',icon:'bi-plus-slash-minus',roles:['管理員','導師','任課教師']},
    {id:'classes',label:'班級管理',icon:'bi-collection',roles:['管理員','行政']},
    {id:'reasons',label:'加減分規則',icon:'bi-list-check',roles:['管理員']},
    {id:'users',label:'使用者管理',icon:'bi-person-gear',roles:['管理員']},
    {id:'settings',label:'系統設定',icon:'bi-gear',roles:['管理員']},
    {id:'audit',label:'操作紀錄',icon:'bi-journal-text',roles:['管理員']}
  ];
  const TITLES={dashboard:['OVERVIEW','Dashboard'],attendance:['DAILY ATTENDANCE','今日點名'],students:['STUDENTS','學生管理'],scores:['SCORES','加減分'],classes:['CLASSES','班級管理'],reasons:['SCORE RULES','加減分規則'],users:['ACCOUNTS','使用者管理'],settings:['SETTINGS','系統設定'],audit:['AUDIT TRAIL','操作紀錄']};
  const ResponsiveDataView={render(tableHtml,cardsHtml){return `<div class="desktop-data">${tableHtml}</div><div class="mobile-data-list">${cardsHtml}</div>`;}};

  function esc(v){return String(v==null?'':v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
  function bool(v){return v===true||String(v).toUpperCase()==='TRUE';}
  function fmtDateTime(v){if(!v)return '—';return String(v).replace('T',' ').substring(0,16);}
  function showLoading(on){state.loading+=on?1:-1;state.loading=Math.max(0,state.loading);$('#loading').classList.toggle('d-none',!state.loading);if(on&&state.loading===1)$$('button').forEach(b=>{b.dataset.wasDisabled=b.disabled?'1':'0';b.disabled=true;});if(!state.loading)$$('button').forEach(b=>{b.disabled=b.dataset.wasDisabled==='1';delete b.dataset.wasDisabled;});}
  function toast(message,type=''){const el=$('#toast');el.querySelector('.toast-body').textContent=message;el.className='toast align-items-center border-0 '+(type==='error'?'text-bg-danger':'text-bg-primary');bootstrap.Toast.getOrCreateInstance(el,{delay:3200}).show();}
  function gasCall(name,...args){showLoading(true);return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(v=>{showLoading(false);resolve(v);}).withFailureHandler(err=>{showLoading(false);const msg=(err&&err.message)||String(err)||'系統發生錯誤';if(msg.includes('SESSION_EXPIRED'))forceLogout(msg.replace(/^.*SESSION_EXPIRED[：:]?/,'').trim());reject(new Error(msg));});runner[name].apply(runner,args);});}
  function safe(task){return Promise.resolve().then(task).catch(err=>{console.error(err);toast(err.message||'操作失敗','error');});}
  function classOptions(selected='',activeOnly=false){return (state.boot?.classes||[]).filter(c=>!activeOnly||bool(c['啟用狀態'])).map(c=>`<option value="${esc(c['班級ID'])}" ${String(c['班級ID'])===String(selected)?'selected':''}>${esc(c['班級名稱'])}</option>`).join('');}
  function tag(text,color=''){return `<span class="tag ${color}">${esc(text)}</span>`;}
  function empty(text='目前沒有資料'){return `<div class="empty"><i class="bi bi-inbox fs-1 d-block mb-2" aria-hidden="true"></i>${esc(text)}</div>`;}
  function activeTag(v){return bool(v)?tag('啟用','green'):tag('停用','red');}
  function closeSidebar(){if(window.innerWidth<992)bootstrap.Offcanvas.getOrCreateInstance($('#sidebar')).hide();}

  function applyPreferences(){
    document.body.classList.toggle('view-mobile',state.viewMode==='mobile');document.body.classList.toggle('view-desktop',state.viewMode==='desktop');
    const dark=window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-bs-theme',state.themeMode==='auto'?(dark?'dark':'light'):state.themeMode);
    $$('[data-view-mode]').forEach(b=>b.classList.toggle('active',b.dataset.viewMode===state.viewMode));$$('[data-theme-mode]').forEach(b=>b.classList.toggle('active',b.dataset.themeMode===state.themeMode));
  }

  async function init(){
    $('#loginForm').addEventListener('submit',onLogin);$('#logoutBtn').addEventListener('click',()=>safe(doLogout));$('#passwordBtn').addEventListener('click',openPasswordModal);
    $$('[data-view-mode]').forEach(b=>b.addEventListener('click',()=>{state.viewMode=b.dataset.viewMode;localStorage.setItem('class_manager_view',state.viewMode);applyPreferences();}));$$('[data-theme-mode]').forEach(b=>b.addEventListener('click',()=>{state.themeMode=b.dataset.themeMode;localStorage.setItem('class_manager_theme',state.themeMode);applyPreferences();}));window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(state.themeMode==='auto')applyPreferences();});applyPreferences();
    try{const config=await gasCall('getPublicConfig');$('#loginTitle').textContent=config.systemName||'班級管理系統';$('#loginSubtitle').textContent=config.schoolName?config.schoolName+'｜請使用系統帳號登入':'請使用系統帳號登入';$('#setupHint').classList.toggle('d-none',config.initialized!==false);}catch(e){}
    if(state.token)await safe(async()=>{await enterApp();});
  }
  async function onLogin(e){e.preventDefault();await safe(async()=>{const result=await gasCall('login',$('#username').value,$('#password').value);state.token=result.token;localStorage.setItem('class_manager_token',state.token);$('#password').value='';await enterApp();toast('登入成功');});}
  async function enterApp(){state.boot=await gasCall('getBootstrap',state.token);$('#loginView').classList.add('d-none');$('#appView').classList.remove('d-none');$('#appName').textContent=state.boot.systemName;$('#schoolName').textContent=state.boot.schoolName||'';$('#userName').textContent=state.boot.user['姓名'];$('#userRole').textContent=state.boot.user['角色'];$('#avatar').textContent=(state.boot.user['姓名']||'師').substring(0,1);renderNav();navigate('dashboard');}
  function forceLogout(message=''){state.token='';state.boot=null;localStorage.removeItem('class_manager_token');$('#appView').classList.add('d-none');$('#loginView').classList.remove('d-none');if(message)toast(message,'error');}
  async function doLogout(){try{if(state.token)await gasCall('logout',state.token);}finally{forceLogout();}}
  function renderNav(){const role=state.boot.user['角色'];$('#nav').innerHTML=NAV.filter(n=>n.roles.includes(role)).map(n=>`<button class="nav-link text-start" data-page="${n.id}"><i class="bi ${n.icon} me-2" aria-hidden="true"></i>${n.label}</button>`).join('');$$('#nav button').forEach(b=>b.addEventListener('click',()=>{navigate(b.dataset.page);closeSidebar();}));}
  function navigate(page){state.page=page;$$('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#pageEyebrow').textContent=TITLES[page][0];$('#pageTitle').textContent=TITLES[page][1];$('#content').innerHTML='';const fn={dashboard:renderDashboard,attendance:renderAttendance,students:renderStudents,scores:renderScores,classes:renderClasses,reasons:renderReasons,users:renderUsers,settings:renderSettings,audit:renderAudit}[page];safe(fn);}
  function openModal(title,html,wide=false){$('#modalTitle').textContent=title;$('#modalBody').innerHTML=html;$('#modal .modal-dialog').classList.toggle('modal-xl',wide);bootstrap.Modal.getOrCreateInstance($('#modal')).show();}
  function closeModal(){bootstrap.Modal.getOrCreateInstance($('#modal')).hide();setTimeout(()=>{$('#modalBody').innerHTML='';},180);}
  function confirmAction(message){return new Promise(resolve=>{const el=$('#confirmModal'),modal=bootstrap.Modal.getOrCreateInstance(el);$('#confirmMessage').textContent=message;let settled=false;const accept=()=>{settled=true;resolve(true);modal.hide();};const hidden=()=>{if(!settled)resolve(false);$('#confirmAccept').removeEventListener('click',accept);el.removeEventListener('hidden.bs.modal',hidden);};$('#confirmAccept').addEventListener('click',accept,{once:true});el.addEventListener('hidden.bs.modal',hidden,{once:true});modal.show();});}
  function values(form){return Object.fromEntries(new FormData(form).entries());}

  async function renderDashboard(){
    const initial=state.boot.user['班級ID']||state.boot.classes[0]?.['班級ID']||'';
    $('#content').innerHTML=`<div class="toolbar"><label>班級<select id="dashClass">${classOptions(initial,true)}</select></label><label>日期<input id="dashDate" type="date" value="${esc(state.boot.today)}"></label><button id="dashRefresh" class="btn primary">更新統計</button></div><div id="dashBody"></div>`;
    $('#dashRefresh').addEventListener('click',load);$('#dashClass').addEventListener('change',load);await load();
    async function load(){const classId=$('#dashClass').value;if(!classId){$('#dashBody').innerHTML=empty('尚無可查看的班級');return;}const d=await gasCall('getDashboard',state.token,classId,$('#dashDate').value);$('#dashBody').innerHTML=`<div class="metrics"><div class="metric blue"><small>學生總數</small><strong>${d.studentCount}</strong></div><div class="metric green"><small>今日出席</small><strong>${d.present}</strong></div><div class="metric amber"><small>今日遲到</small><strong>${d.late}</strong></div><div class="metric amber"><small>今日早退</small><strong>${d.early}</strong></div><div class="metric red"><small>今日缺席</small><strong>${d.absent}</strong></div><div class="metric amber"><small>今日請假</small><strong>${d.leave}</strong></div><div class="metric green"><small>本日加分</small><strong>+${d.positive}</strong></div><div class="metric red"><small>本日扣分</small><strong>${d.negative}</strong></div><div class="metric blue"><small>目前班級</small><strong style="font-size:1.2rem">${esc(d.className)}</strong></div></div><section class="panel"><div class="panel-head"><h3>${esc(d.date)} 班級快照</h3></div><p class="text-body-secondary">點名完成度 ${d.studentCount?Math.round((d.present+d.late+d.early+d.absent+d.leave)/d.studentCount*100):0}%；本日淨分數 ${d.positive+d.negative}。</p></section>`;}
  }

  async function renderAttendance(){
    const initial=state.boot.user['班級ID']||state.boot.classes[0]?.['班級ID']||'';
    $('#content').innerHTML=`<div class="toolbar"><label>日期<input id="attDate" type="date" value="${esc(state.boot.today)}"></label><label>班級<select id="attClass">${classOptions(initial,true)}</select></label><button id="attLoad" class="btn ghost">載入名單</button><button id="allPresent" class="btn success push">全部出席</button><button id="saveAttendance" class="btn primary">儲存點名</button></div><div id="attSummary" class="summary-strip"></div><div id="attGrid" class="attendance-grid"></div>`;
    $('#attLoad').addEventListener('click',load);$('#attClass').addEventListener('change',load);$('#attDate').addEventListener('change',load);$('#allPresent').addEventListener('click',allPresent);$('#saveAttendance').addEventListener('click',save);if(initial)await load();else $('#attGrid').innerHTML=empty('尚無可點名班級');
    async function load(){const classId=$('#attClass').value;if(!classId)return;const data=await gasCall('getDailyAttendance',state.token,classId,$('#attDate').value);state.attendance={classId,date:data.date,entries:data.students.map(x=>({student:x.student,record:x.attendance,status:x.attendance?.['狀態']||'出席',leaveType:x.attendance?.['假別']||'',arrivalTime:x.attendance?.['到校時間']||'',departureTime:x.attendance?.['離校時間']||'',note:x.attendance?.['備註']||'',changed:false}))};drawCards();}
    function drawCards(){const a=state.attendance;if(!a||!a.entries.length){$('#attGrid').innerHTML=empty('班級中沒有啟用中的學生');$('#attSummary').innerHTML='';return;}const counts={};a.entries.forEach(e=>counts[e.status]=(counts[e.status]||0)+1);$('#attSummary').innerHTML=state.boot.statuses.map(s=>tag(`${s} ${counts[s]||0}`,s==='出席'?'green':s==='缺席'?'red':'amber')).join('');$('#attGrid').innerHTML=a.entries.map((e,i)=>`<article class="student-card ${e.changed?'changed':''}" data-i="${i}"><div class="student-card-head"><div class="seat">${String(e.student['座號']).padStart(2,'0')}</div><div><strong>${esc(e.student['姓名'])}</strong><div class="muted">${esc(e.student['學號'])}</div></div>${e.record?'<span class="tag blue" style="margin-left:auto">已登錄</span>':''}</div><div class="status-buttons">${state.boot.statuses.map(s=>`<button type="button" data-status="${s}" class="${e.status===s?'selected':''}">${s}</button>`).join('')}</div><div class="attendance-extra"><label class="leave-row ${e.status==='請假'?'':'hidden'}">假別<select data-field="leaveType">${state.boot.leaveTypes.map(t=>`<option ${e.leaveType===t?'selected':''}>${t}</option>`).join('')}</select></label><label>到校時間<input type="time" data-field="arrivalTime" value="${esc(e.arrivalTime)}"></label><label>離校時間<input type="time" data-field="departureTime" value="${esc(e.departureTime)}"></label><label class="full">備註<input data-field="note" value="${esc(e.note)}" placeholder="可留空"></label></div></article>`).join('');$$('.student-card').forEach(card=>{const i=Number(card.dataset.i);card.querySelectorAll('[data-status]').forEach(b=>b.addEventListener('click',()=>{a.entries[i].status=b.dataset.status;if(b.dataset.status!=='請假')a.entries[i].leaveType='';a.entries[i].changed=true;drawCards();}));card.querySelectorAll('[data-field]').forEach(el=>el.addEventListener('change',()=>{a.entries[i][el.dataset.field]=el.value;a.entries[i].changed=true;card.classList.add('changed');}));});}
    async function allPresent(){if(!state.attendance)return;await gasCall('setAllPresent',state.token,state.attendance.classId,state.attendance.date);toast('全班已設為出席');await load();}
    async function save(){const a=state.attendance;if(!a)return;await gasCall('saveAttendance',state.token,{classId:a.classId,date:a.date,entries:a.entries.map(e=>({studentId:e.student['學生ID'],status:e.status,leaveType:e.leaveType,arrivalTime:e.arrivalTime,departureTime:e.departureTime,note:e.note}))});toast('點名已儲存');await load();}
  }

  async function renderStudents(){
    const canEdit=['管理員','導師'].includes(state.boot.user['角色']);
    $('#content').innerHTML=`<div class="toolbar"><label>班級<select id="stuClass"><option value="">全部可查看班級</option>${classOptions('',false)}</select></label><label class="grow">搜尋<input id="stuKeyword" placeholder="輸入學號或姓名"></label><label>狀態<select id="stuActive"><option value="true">啟用</option><option value="">全部</option><option value="false">停用</option></select></label><button id="stuSearch" class="btn ghost">查詢</button>${canEdit?'<button id="newStudent" class="btn primary push">新增學生</button>':''}</div><section class="panel"><div id="studentTable"></div></section>`;
    $('#stuSearch').addEventListener('click',load);$('#stuKeyword').addEventListener('keydown',e=>{if(e.key==='Enter')load();});if(canEdit)$('#newStudent').addEventListener('click',()=>studentForm());await load();
    async function load(){const rows=await gasCall('getStudents',state.token,{classId:$('#stuClass').value,keyword:$('#stuKeyword').value,active:$('#stuActive').value});state.cache.students=rows;$('#studentTable').innerHTML=rows.length?`<div class="desktop-data table-wrap"><table class="table table-hover align-middle"><thead><tr><th>座號</th><th>學號</th><th>姓名</th><th>班級</th><th>狀態</th><th>操作</th></tr></thead><tbody>${rows.map(s=>`<tr><td>${esc(s['座號'])}</td><td>${esc(s['學號'])}</td><td><button class="link-btn" data-detail="${esc(s['學生ID'])}">${esc(s['姓名'])}</button></td><td>${esc(s['班級名稱'])}</td><td>${activeTag(s['啟用狀態'])}</td><td class="actions">${canEdit?`<button class="link-btn" data-edit="${esc(s['學生ID'])}">編輯</button><button class="link-btn" data-active="${esc(s['學生ID'])}">${bool(s['啟用狀態'])?'停用':'啟用'}</button>`:'查看個人資料'}</td></tr>`).join('')}</tbody></table></div><div class="mobile-data-list">${rows.map(s=>`<article class="mobile-data-card"><div class="d-flex gap-3 align-items-start"><div class="seat">${String(s['座號']).padStart(2,'0')}</div><div class="flex-grow-1"><h3 class="h6 mb-1">${esc(s['姓名'])}</h3><div class="meta">學號 ${esc(s['學號'])}｜${esc(s['班級名稱'])}</div><div class="mt-2">${activeTag(s['啟用狀態'])}</div></div></div><div class="d-flex gap-2 mt-3"><button class="btn btn-outline-primary flex-grow-1" data-detail="${esc(s['學生ID'])}"><i class="bi bi-eye me-1" aria-hidden="true"></i>查看</button>${canEdit?`<button class="btn btn-outline-secondary" data-edit="${esc(s['學生ID'])}"><i class="bi bi-pencil" aria-hidden="true"></i><span class="visually-hidden">編輯</span></button><button class="btn btn-outline-secondary" data-active="${esc(s['學生ID'])}">${bool(s['啟用狀態'])?'停用':'啟用'}</button>`:''}</div></article>`).join('')}</div>`:empty();$$('[data-detail]').forEach(b=>b.addEventListener('click',()=>studentDetail(b.dataset.detail)));$$('[data-edit]').forEach(b=>b.addEventListener('click',()=>studentForm(rows.find(s=>s['學生ID']===b.dataset.edit))));$$('[data-active]').forEach(b=>b.addEventListener('click',()=>safe(async()=>{const s=rows.find(x=>x['學生ID']===b.dataset.active);if(!await confirmAction(`確定要${bool(s['啟用狀態'])?'停用':'啟用'}學生「${s['姓名']}」嗎？`))return;await gasCall('setStudentActive',state.token,s['學生ID'],!bool(s['啟用狀態']));toast('學生狀態已更新');await load();})));}
    function studentForm(s=null){openModal(s?'編輯學生':'新增學生',`<form id="studentForm" class="form-grid"><label>學號<input name="studentNo" required value="${esc(s?.['學號']||'')}"></label><label>姓名<input name="name" required value="${esc(s?.['姓名']||'')}"></label><label>班級<select name="classId" required>${classOptions(s?.['班級ID']||'',true)}</select></label><label>座號<input name="seatNo" type="number" min="1" required value="${esc(s?.['座號']||'')}"></label><div class="full"><button class="btn primary wide">儲存</button></div></form>`);$('#studentForm').addEventListener('submit',e=>safe(async()=>{e.preventDefault();const d=values(e.target);if(s)await gasCall('updateStudent',state.token,s['學生ID'],d);else await gasCall('createStudent',state.token,d);closeModal();toast('學生資料已儲存');await load();}));}
  }

  async function studentDetail(id){const d=await gasCall('getStudentDetails',state.token,id);openModal(`${d.student['姓名']}｜學生詳細資料`,`<div class="metrics"><div class="metric blue"><small>目前累計</small><strong>${d.totals.total}</strong></div><div class="metric green"><small>加分總計</small><strong>+${d.totals.positive}</strong></div><div class="metric red"><small>扣分總計</small><strong>${d.totals.negative}</strong></div></div><p><strong>${esc(d.student['班級名稱'])}｜${esc(d.student['座號'])} 號</strong><br><span class="muted">學號 ${esc(d.student['學號'])}</span></p><h3>加減分歷史</h3>${d.scores.length?simpleTable(['日期','原因名稱','分數','備註','登錄老師'],d.scores):empty('沒有加減分紀錄')}<h3 style="margin-top:22px">出缺席歷史</h3>${d.attendance.length?simpleTable(['日期','狀態','假別','到校時間','離校時間','備註','登錄老師'],d.attendance):empty('沒有出缺席紀錄')}`,true);}
  function simpleTable(cols,rows){return ResponsiveDataView.render(`<div class="table-wrap"><table class="table table-hover align-middle"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c]||'—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`,rows.map(r=>`<article class="mobile-data-card">${cols.map((c,i)=>i===0?`<h4 class="h6">${esc(r[c]||'—')}</h4>`:`<div class="meta"><strong>${c}：</strong>${esc(r[c]||'—')}</div>`).join('')}</article>`).join(''));}

  async function renderScores(){
    const initial=state.boot.user['班級ID']||state.boot.classes[0]?.['班級ID']||'';
    $('#content').innerHTML=`<div class="toolbar"><label>班級<select id="scoreClass">${classOptions(initial,true)}</select></label><label>日期<input id="scoreDate" type="date" value="${esc(state.boot.today)}"></label><button id="scoreLoad" class="btn ghost">載入</button><button id="newScore" class="btn primary push">新增加減分</button></div><section class="panel"><div id="scoreTable"></div></section>`;
    $('#scoreLoad').addEventListener('click',load);$('#newScore').addEventListener('click',()=>scoreForm());await load();
    async function preload(){const classId=$('#scoreClass').value;const [students,reasons]=await Promise.all([gasCall('getStudents',state.token,{classId:classId,active:true}),gasCall('getScoreReasons',state.token)]);state.cache.scoreStudents=students;state.cache.reasons=reasons.filter(r=>bool(r['啟用狀態']));}
    async function load(){if(!$('#scoreClass').value){$('#scoreTable').innerHTML=empty('尚無班級');return;}await preload();const rows=await gasCall('getScores',state.token,{classId:$('#scoreClass').value,dateFrom:$('#scoreDate').value,dateTo:$('#scoreDate').value});state.cache.scores=rows;$('#scoreTable').innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>日期</th><th>學生</th><th>原因</th><th>分數</th><th>備註</th><th>登錄者</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r['日期'])}</td><td>${esc(r['學生姓名'])}</td><td>${esc(r['原因名稱'])}</td><td>${tag((Number(r['分數'])>0?'+':'')+r['分數'],Number(r['分數'])>=0?'green':'red')}</td><td>${esc(r['備註']||'—')}</td><td>${esc(r['登錄者姓名'])}</td><td class="actions"><button class="link-btn" data-score-edit="${r['紀錄ID']}">編輯</button><button class="link-btn" data-score-delete="${r['紀錄ID']}">刪除</button></td></tr>`).join('')}</tbody></table></div>`:empty('當日沒有加減分紀錄');$$('[data-score-edit]').forEach(b=>b.addEventListener('click',()=>scoreForm(rows.find(r=>r['紀錄ID']===b.dataset.scoreEdit))));$$('[data-score-delete]').forEach(b=>b.addEventListener('click',()=>safe(async()=>{if(!await confirmAction('確定要刪除此筆加減分紀錄嗎？紀錄將保留於稽核歷程。'))return;await gasCall('deleteScore',state.token,b.dataset.scoreDelete);toast('紀錄已刪除');await load();})));}
    async function scoreForm(r=null){await preload();const students=state.cache.scoreStudents,reasons=state.cache.reasons;if(!students.length||!reasons.length){toast('請先建立學生與啟用中的加減分規則','error');return;}openModal(r?'編輯加減分':'新增加減分',`<form id="scoreForm" class="form-grid"><label>日期<input name="date" type="date" required value="${esc(r?.['日期']||$('#scoreDate').value)}"></label><label>學生<select name="studentId">${students.map(s=>`<option value="${s['學生ID']}" ${r?.['學生ID']===s['學生ID']?'selected':''}>${esc(String(s['座號']).padStart(2,'0')+' '+s['姓名'])}</option>`).join('')}</select></label><label>原因<select name="reasonId" id="reasonSelect">${reasons.map(x=>`<option value="${x['原因ID']}" data-score="${x['預設分數']}" ${r?.['原因ID']===x['原因ID']?'selected':''}>${esc(x['名稱'])}</option>`).join('')}</select></label><label>分數<input name="score" id="scoreValue" type="number" step="any" required value="${esc(r?.['分數']??reasons[0]['預設分數'])}"></label><label class="full">備註<textarea name="note">${esc(r?.['備註']||'')}</textarea></label><div class="full"><button class="btn primary wide">儲存</button></div></form>`);$('#reasonSelect').addEventListener('change',e=>$('#scoreValue').value=e.target.selectedOptions[0].dataset.score);$('#scoreForm').addEventListener('submit',e=>safe(async()=>{e.preventDefault();const d=values(e.target);if(r)await gasCall('updateScore',state.token,r['紀錄ID'],d);else await gasCall('addScore',state.token,d);closeModal();toast('加減分已儲存');await load();}));}
  }

  async function renderClasses(){
    const admin=state.boot.user['角色']==='管理員';$('#content').innerHTML=`<div class="toolbar">${admin?'<button id="newClass" class="btn primary push">新增班級</button>':''}</div><section class="panel"><div id="classTable"></div></section>`;if(admin)$('#newClass').addEventListener('click',()=>classForm());await load();
    async function load(){const rows=await gasCall('getClasses',state.token);state.boot.classes=rows;$('#classTable').innerHTML=rows.length?`<div class="desktop-data table-wrap"><table class="table table-hover align-middle"><thead><tr><th>學年度</th><th>學期</th><th>年級</th><th>班級</th><th>導師</th><th>狀態</th>${admin?'<th>操作</th>':''}</tr></thead><tbody>${rows.map(c=>`<tr><td>${esc(c['學年度'])}</td><td>${esc(c['學期'])}</td><td>${esc(c['年級'])}</td><td>${esc(c['班級名稱'])}</td><td>${esc(c['導師姓名']||'—')}</td><td>${activeTag(c['啟用狀態'])}</td>${admin?`<td class="actions"><button class="link-btn" data-class-edit="${c['班級ID']}">編輯</button><button class="link-btn" data-class-active="${c['班級ID']}">${bool(c['啟用狀態'])?'停用':'啟用'}</button></td>`:''}</tr>`).join('')}</tbody></table></div><div class="mobile-data-list">${rows.map(c=>`<article class="mobile-data-card"><div class="d-flex justify-content-between"><div><h3 class="h6 mb-1">${esc(c['班級名稱'])}</h3><div class="meta">${esc(c['學年度'])} 學年度｜第 ${esc(c['學期'])} 學期｜${esc(c['年級'])} 年級</div><div class="meta">導師：${esc(c['導師姓名']||'未指定')}</div></div>${activeTag(c['啟用狀態'])}</div>${admin?`<div class="d-flex gap-2 mt-3"><button class="btn btn-outline-primary flex-grow-1" data-class-edit="${c['班級ID']}">編輯</button><button class="btn btn-outline-secondary" data-class-active="${c['班級ID']}">${bool(c['啟用狀態'])?'停用':'啟用'}</button></div>`:''}</article>`).join('')}</div>`:empty();$$('[data-class-edit]').forEach(b=>b.addEventListener('click',()=>classForm(rows.find(c=>c['班級ID']===b.dataset.classEdit))));$$('[data-class-active]').forEach(b=>b.addEventListener('click',()=>safe(async()=>{const c=rows.find(x=>x['班級ID']===b.dataset.classActive);if(!await confirmAction(`確定要${bool(c['啟用狀態'])?'停用':'啟用'}班級「${c['班級名稱']}」嗎？`))return;await gasCall('setClassActive',state.token,c['班級ID'],!bool(c['啟用狀態']));toast('班級狀態已更新');await load();})));}
    async function classForm(c=null){let users=[];try{users=await gasCall('getUsers',state.token);}catch(e){}const teachers=users.filter(u=>['導師','管理員'].includes(u['角色'])&&bool(u['啟用狀態']));openModal(c?'編輯班級':'新增班級',`<form id="classForm" class="form-grid"><label>學年度<input name="schoolYear" type="number" required value="${esc(c?.['學年度']||115)}"></label><label>學期<select name="semester"><option ${c?.['學期']==1?'selected':''}>1</option><option ${c?.['學期']==2?'selected':''}>2</option></select></label><label>年級<input name="grade" type="number" min="1" required value="${esc(c?.['年級']||1)}"></label><label>班級名稱<input name="name" required value="${esc(c?.['班級名稱']||'')}"></label><label class="full">導師<select name="teacherId"><option value="">尚未指定</option>${teachers.map(t=>`<option value="${t['使用者ID']}" ${c?.['導師ID']===t['使用者ID']?'selected':''}>${esc(t['姓名'])}</option>`).join('')}</select></label><div class="full"><button class="btn primary wide">儲存</button></div></form>`);$('#classForm').addEventListener('submit',e=>safe(async()=>{e.preventDefault();const d=values(e.target);if(c)await gasCall('updateClass',state.token,c['班級ID'],d);else await gasCall('createClass',state.token,d);closeModal();toast('班級已儲存');await load();}));}
  }

  async function renderReasons(){
    $('#content').innerHTML=`<div class="toolbar"><button id="newReason" class="btn primary push">新增規則</button></div><section class="panel"><div id="reasonTable"></div></section>`;$('#newReason').addEventListener('click',()=>reasonForm());await load();
    async function load(){const rows=await gasCall('getScoreReasons',state.token);$('#reasonTable').innerHTML=rows.length?`<div class="table-wrap"><table class="table"><thead><tr><th>排序</th><th>名稱</th><th>類別</th><th>預設分數</th><th>說明</th><th>狀態</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r['排序'])}</td><td>${esc(r['名稱'])}</td><td>${tag(r['類別'],r['類別']==='加分'?'green':'red')}</td><td>${esc(r['預設分數'])}</td><td>${esc(r['說明']||'—')}</td><td>${activeTag(r['啟用狀態'])}</td><td><button class="link-btn" data-reason-edit="${r['原因ID']}">編輯</button><button class="link-btn" data-reason-active="${r['原因ID']}">${bool(r['啟用狀態'])?'停用':'啟用'}</button></td></tr>`).join('')}</tbody></table></div>`:empty();$$('[data-reason-edit]').forEach(b=>b.addEventListener('click',()=>reasonForm(rows.find(r=>r['原因ID']===b.dataset.reasonEdit))));$$('[data-reason-active]').forEach(b=>b.addEventListener('click',()=>safe(async()=>{const r=rows.find(x=>x['原因ID']===b.dataset.reasonActive);await gasCall('setScoreReasonActive',state.token,r['原因ID'],!bool(r['啟用狀態']));toast('規則狀態已更新');await load();})));}
    function reasonForm(r=null){openModal(r?'編輯規則':'新增規則',`<form id="reasonForm" class="form-grid"><label>名稱<input name="name" required value="${esc(r?.['名稱']||'')}"></label><label>類別<select name="category"><option ${r?.['類別']==='加分'?'selected':''}>加分</option><option ${r?.['類別']==='扣分'?'selected':''}>扣分</option></select></label><label>預設分數<input name="defaultScore" type="number" step="any" required value="${esc(r?.['預設分數']??1)}"></label><label>排序<input name="sort" type="number" value="${esc(r?.['排序']??0)}"></label><label class="full">說明<textarea name="description">${esc(r?.['說明']||'')}</textarea></label><div class="full"><button class="btn primary wide">儲存</button></div></form>`);$('#reasonForm').addEventListener('submit',e=>safe(async()=>{e.preventDefault();const d=values(e.target);if(r)await gasCall('updateScoreReason',state.token,r['原因ID'],d);else await gasCall('createScoreReason',state.token,d);closeModal();toast('規則已儲存');await load();}));}
  }

  async function renderUsers(){
    $('#content').innerHTML=`<div class="toolbar"><button id="newUser" class="btn primary push">新增使用者</button></div><section class="panel"><div id="userTable"></div></section>`;$('#newUser').addEventListener('click',()=>userForm());await load();
    async function load(){const rows=await gasCall('getUsers',state.token);state.cache.users=rows;$('#userTable').innerHTML=rows.length?`<div class="desktop-data table-wrap"><table class="table table-hover align-middle"><thead><tr><th>帳號</th><th>姓名</th><th>角色</th><th>班級</th><th>最後登入</th><th>狀態</th><th>操作</th></tr></thead><tbody>${rows.map(u=>`<tr><td>${esc(u['帳號'])}</td><td>${esc(u['姓名'])}</td><td>${tag(u['角色'],'blue')}</td><td>${esc(u['班級名稱']||'—')}</td><td>${fmtDateTime(u['最後登入時間'])}</td><td>${activeTag(u['啟用狀態'])}</td><td class="actions"><button class="link-btn" data-user-edit="${u['使用者ID']}">編輯</button><button class="link-btn" data-user-reset="${u['使用者ID']}">重設密碼</button><button class="link-btn" data-user-active="${u['使用者ID']}">${bool(u['啟用狀態'])?'停用':'啟用'}</button></td></tr>`).join('')}</tbody></table></div><div class="mobile-data-list">${rows.map(u=>`<article class="mobile-data-card"><div class="d-flex justify-content-between gap-2"><div><h3 class="h6 mb-1">${esc(u['姓名'])}</h3><div class="meta">@${esc(u['帳號'])}｜${esc(u['班級名稱']||'未指定班級')}</div></div>${activeTag(u['啟用狀態'])}</div><div class="mt-2">${tag(u['角色'],'blue')}</div><div class="d-grid gap-2 mt-3"><button class="btn btn-outline-primary" data-user-edit="${u['使用者ID']}"><i class="bi bi-pencil me-1" aria-hidden="true"></i>編輯</button><button class="btn btn-outline-secondary" data-user-reset="${u['使用者ID']}"><i class="bi bi-key me-1" aria-hidden="true"></i>重設密碼</button><button class="btn btn-outline-secondary" data-user-active="${u['使用者ID']}">${bool(u['啟用狀態'])?'停用':'啟用'}</button></div></article>`).join('')}</div>`:empty();$$('[data-user-edit]').forEach(b=>b.addEventListener('click',()=>userForm(rows.find(u=>u['使用者ID']===b.dataset.userEdit))));$$('[data-user-reset]').forEach(b=>b.addEventListener('click',()=>resetPassword(b.dataset.userReset)));$$('[data-user-active]').forEach(b=>b.addEventListener('click',()=>safe(async()=>{const u=rows.find(x=>x['使用者ID']===b.dataset.userActive);if(!await confirmAction(`確定要${bool(u['啟用狀態'])?'停用':'啟用'}帳號「${u['姓名']}」嗎？停用會讓既有 Session 立即失效。`))return;await gasCall('setUserActive',state.token,u['使用者ID'],!bool(u['啟用狀態']));toast('帳號狀態已更新');await load();})));}
    function userForm(u=null){openModal(u?'編輯使用者':'新增使用者',`<form id="userForm" class="form-grid">${u?'':`<label>帳號<input name="username" autocomplete="off" required></label><label>初始密碼<input name="password" type="password" minlength="8" autocomplete="new-password" required></label>`}<label>姓名<input name="name" required value="${esc(u?.['姓名']||'')}"></label><label>角色<select name="role">${state.boot.roles.map(r=>`<option ${u?.['角色']===r?'selected':''}>${r}</option>`).join('')}</select></label><label class="full">授權班級<select name="classId"><option value="">不指定</option>${classOptions(u?.['班級ID']||'',false)}</select></label><div class="full"><button class="btn primary wide">儲存</button></div></form>`);$('#userForm').addEventListener('submit',e=>safe(async()=>{e.preventDefault();const d=values(e.target);if(u)await gasCall('updateUser',state.token,u['使用者ID'],d);else await gasCall('createUser',state.token,d);closeModal();toast('使用者已儲存');await load();}));}
    function resetPassword(id){openModal('重設密碼',`<form id="resetForm" class="stack"><label>新密碼<input name="password" type="password" minlength="8" required autocomplete="new-password"></label><button class="btn primary wide">設定新密碼</button></form>`);$('#resetForm').addEventListener('submit',e=>safe(async()=>{e.preventDefault();await gasCall('resetUserPassword',state.token,id,values(e.target).password);closeModal();toast('密碼已重設，該使用者需重新登入');}));}
  }

  async function renderSettings(){const rows=await gasCall('getSettings',state.token);const map={};rows.forEach(r=>map[r['設定鍵']]=r['設定值']);$('#content').innerHTML=`<section class="panel"><form id="settingsForm" class="form-grid"><label>系統名稱<input name="system_name" required value="${esc(map.system_name)}"></label><label>學校名稱<input name="school_name" value="${esc(map.school_name)}"></label><label>目前學年度<input name="school_year" type="number" required value="${esc(map.school_year)}"></label><label>目前學期<select name="semester"><option ${map.semester==1?'selected':''}>1</option><option ${map.semester==2?'selected':''}>2</option></select></label><label>遲到判定時間<input name="late_time" type="time" required value="${esc(map.late_time)}"></label><label>Session 有效時數<input name="session_ttl_hours" type="number" min="1" max="720" required value="${esc(map.session_ttl_hours)}"></label><div class="full"><button class="btn primary">儲存設定</button></div></form></section>`;$('#settingsForm').addEventListener('submit',e=>safe(async()=>{e.preventDefault();await gasCall('updateSettings',state.token,values(e.target));state.boot=await gasCall('getBootstrap',state.token);$('#appName').textContent=state.boot.systemName;$('#schoolName').textContent=state.boot.schoolName;toast('系統設定已更新');}));}

  async function renderAudit(){
    $('#content').innerHTML=`<div class="toolbar"><label>操作<select id="auditAction"><option value="">全部</option>${['CREATE','UPDATE','DELETE','LOGIN','LOGOUT','PASSWORD_CHANGE'].map(x=>`<option>${x}</option>`).join('')}</select></label><button id="auditLoad" class="btn ghost">查詢</button></div><section class="panel"><div id="auditTable"></div></section>`;$('#auditLoad').addEventListener('click',load);await load();
    async function load(){const rows=await gasCall('getAuditLogs',state.token,{action:$('#auditAction').value});$('#auditTable').innerHTML=rows.length?`<div class="desktop-data table-wrap"><table class="table table-hover align-middle"><thead><tr><th>時間</th><th>使用者</th><th>操作</th><th>資料表</th><th>資料ID</th><th>來源</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${fmtDateTime(r['操作時間'])}</td><td>${esc(r['使用者名稱']||r['使用者ID'])}</td><td>${tag(r['操作'],r['操作']==='DELETE'?'red':r['操作']==='CREATE'?'green':'blue')}</td><td>${esc(r['資料表'])}</td><td>${esc(r['資料ID'])}</td><td>${esc(r['來源'])}</td></tr>`).join('')}</tbody></table></div><div class="mobile-data-list accordion" id="auditAccordion">${rows.map((r,i)=>`<article class="accordion-item"><h3 class="accordion-header"><button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#audit-${i}" aria-expanded="false" aria-controls="audit-${i}"><span>${tag(r['操作'],r['操作']==='DELETE'?'red':r['操作']==='CREATE'?'green':'blue')} <span class="ms-2">${esc(r['資料表'])}</span><small class="d-block text-body-secondary mt-1">${fmtDateTime(r['操作時間'])}｜${esc(r['使用者名稱']||r['使用者ID'])}</small></span></button></h3><div id="audit-${i}" class="accordion-collapse collapse" data-bs-parent="#auditAccordion"><div class="accordion-body"><div><strong>資料 ID：</strong>${esc(r['資料ID']||'—')}</div><div class="mt-2"><strong>修改前</strong><pre class="small bg-body-tertiary p-2 rounded text-wrap">${esc(r['修改前']||'—')}</pre></div><div><strong>修改後</strong><pre class="small bg-body-tertiary p-2 rounded text-wrap">${esc(r['修改後']||'—')}</pre></div></div></div></article>`).join('')}</div>`:empty();}
  }

  function openPasswordModal(){openModal('修改密碼',`<form id="passwordForm" class="stack"><label>舊密碼<input name="oldPassword" type="password" autocomplete="current-password" required></label><label>新密碼<input name="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><button class="btn primary wide">更新密碼</button></form>`);$('#passwordForm').addEventListener('submit',e=>safe(async()=>{e.preventDefault();const d=values(e.target);await gasCall('changePassword',state.token,d.oldPassword,d.newPassword);closeModal();toast('密碼已更新');}));}
  init();
})();
</script>
